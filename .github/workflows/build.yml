name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/samsung/a03s

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Configure git
        run: |
          git config --global user.name "gh-actions"
          git config --global user.email "gh-actions@github.com"

      - name: Initialize TWRP minimal manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1

      - name: Sync TWRP source
        run: |
          cd ~/twrp
          repo sync -j8 --force-sync --no-clone-bundle --no-tags

      - name: Copy device tree
        run: |
          cd ~/twrp
          mkdir -p device/samsung
          cp -r $GITHUB_WORKSPACE/device/samsung/a03s device/samsung/a03s

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_a03s-eng
          mka recoveryimage -j8

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-image
          path: ~/twrp/out/target/product/a03s/recovery.img
